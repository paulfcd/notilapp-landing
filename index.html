<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notil · Ton activité nautique, réservée en 2 clics</title>
<meta name="description" content="Notil. Ton activité nautique, réservée en 2 clics. Janvier 2027.">
<meta name="theme-color" content="#070D14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Instrument+Sans:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#070D14;color:#EEF2F6;font-family:'Instrument Sans','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:78% 50%;filter:brightness(.95)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,13,20,.78) 0%,rgba(7,13,20,.35) 45%,rgba(7,13,20,0) 75%),linear-gradient(180deg,rgba(7,13,20,.45) 0%,rgba(7,13,20,0) 22%,rgba(7,13,20,0) 78%,rgba(7,13,20,.55) 100%)}
.in{position:relative;flex:1;display:flex;flex-direction:column;padding:0 clamp(22px,3.4vw,48px)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(22px,3vw,36px) 0}
.brand{display:flex;align-items:flex-end;gap:10px;color:inherit;text-decoration:none}
.brand svg{width:clamp(44px,4.4vw,58px);height:auto;margin-bottom:3px}
.brand span{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(30px,3.1vw,42px);letter-spacing:-.02em;line-height:1}
.tag{font-size:12px;font-weight:500;letter-spacing:.22em;color:#C3CEDA;white-space:nowrap}
main{flex:1;display:flex;align-items:center;padding:24px 0}
h1{margin:0;max-width:11.5em;font-weight:400;font-size:clamp(2.2rem,4.8vw,4.3rem);line-height:1.07;letter-spacing:-.045em}
footer{display:flex;align-items:center;justify-content:space-between;gap:6px 24px;flex-wrap:wrap;padding:clamp(18px,2.4vw,28px) 0;font-size:12px;letter-spacing:.08em;color:#C3CEDA}
footer a{color:#EEF2F6;font-size:14px;letter-spacing:.01em;text-underline-offset:4px;min-height:44px;display:inline-flex;align-items:center}
footer a:hover{color:#fff}
a:focus-visible{outline:2px solid #EEF2F6;outline-offset:4px}
@media (max-width:640px){
  .shade{background:linear-gradient(180deg,rgba(7,13,20,.7) 0%,rgba(7,13,20,.45) 45%,rgba(7,13,20,.15) 70%,rgba(7,13,20,.6) 100%)}
  main{align-items:flex-start;padding-top:12vh}
}
</style>
</head>
<body>
<div class="page">
  <video class="bg" autoplay muted loop playsinline preload="auto" poster="vagues-poster.jpg" aria-hidden="true">
    <source src="vagues.mp4" type="video/mp4">
  </video>
  <div class="shade" aria-hidden="true"></div>
  <div class="in">
    <header>
      <a class="brand" href="./" aria-label="Notil">
        <svg viewBox="0 0 120 80" aria-hidden="true"><path d="M30 54 A30 30 0 0 1 90 54 Z" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><path d="M12 54 H108 M34 68 H86" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg>
        <span>Notil</span>
      </a>
      <span class="tag">JANVIER 2027</span>
    </header>
    <main>
      <h1>Ton activité nautique, réservée en 2&nbsp;clics.</h1>
    </main>
    <footer>
      <span>© 2026 NOTIL</span>
      <a href="mailto:paulfourcard@gmail.com">paulfourcard@gmail.com</a>
    </footer>
  </div>
</div>
<script>
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { var v=document.querySelector('video'); v.removeAttribute('autoplay'); v.pause(); }
</script>
</body>
</html>
